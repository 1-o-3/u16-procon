name = "u16-procon"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# Cloudflare D1 データベースのバインディング
# ※ CloudflareダッシュボードでD1を作成後、database_idを記入するか、
#   Pagesの設定 > 関数 > D1データベースのバインドで「DB」を指定してください。
[[d1_databases]]
binding = "DB"
database_name = "u16-db"
database_id = "YOUR_DATABASE_ID_HERE"

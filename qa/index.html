<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U-16 SHIZUOKA Q&A | よくあるご質問</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700;900&display=swap"
        rel="stylesheet">
    <style>
        .qa-container {
            padding-bottom: 100px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: white;
            border: 1.5px solid var(--primary-light);
            color: var(--text-main);
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(26, 123, 196, 0.30);
        }

        .tab-btn:not(.active):hover {
            background: var(--primary-pale);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* QA List */
        .qa-list {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .qa-list.active {
            display: flex;
        }

        .qa-item {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .qa-question {
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: var(--primary);
            transition: background 0.3s ease;
        }

        .qa-question:hover {
            background: var(--primary-pale);
        }

        .qa-question::after {
            content: '+';
            font-size: 1.5rem;
            color: var(--text-dim);
            transition: transform 0.3s ease;
        }

        .qa-item.open .qa-question::after {
            transform: rotate(45deg);
            color: var(--primary);
        }

        .qa-answer {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease, padding 0.4s ease;
            padding: 0 20px;
            color: var(--text-main);
            background: var(--primary-pale);
            line-height: 1.8;
        }

        .qa-item.open .qa-answer {
            padding: 20px;
            max-height: 500px;
            /* Arbitrary large number */
            border-top: 1px solid var(--glass-border);
        }

        .loading,
        .error {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-style: italic;
        }
    </style>
</head>

<body>
    <header class="topnav" id="topnav">
        <div class="container topnav-inner">
            <a href="/index.html" class="topnav-brand">
                <img src="/logo.png" alt="U-16 ProCon Shizuoka Logo">
                <span>U-16 SHIZUOKA</span>
            </a>
            <nav class="topnav-nav" id="topnav-nav">
                <ul>
                    <li><a href="/index.html" class="tab-blue">HOME</a></li>
                    <li><a href="/about.html" class="tab-orange">大会について</a></li>
                    <li><a href="/schedule.html" class="tab-blue">開催情報</a></li>
                    <li><a href="/sponsor.html" class="tab-orange">スポンサー</a></li>
                    <li><a href="/qa/index.html" class="tab-blue">よくあるご質問</a></li>
                </ul>
                <div class="topnav-cta">
                    <a href="https://forms.gle/92aPXY5QAf1Min1u7" target="_blank" rel="noopener" class="btn-outline">お問い合わせ</a>
                </div>
            </nav>
            <button id="topnav-toggle" class="topnav-toggle" aria-label="メニューを開く">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>
    <div id="topnav-backdrop" class="topnav-backdrop"></div>

    <div class="page-body">
        <main class="qa-container container">
            <div class="page-header" style="padding-left: 0; padding-right: 0; text-align: left;">
                <span class="subtitle">Q&A</span>
                <h2>よくあるご質問</h2>
                <div class="title-line"></div>
            </div>

            <div id="qa-content">
                <div class="loading">Q&Aデータを読み込み中...</div>
            </div>
        </main>

        <footer style="margin-top: 50px;">
            <div class="container">
                <div class="footer-bottom">
                    <p>&copy; 2026- U-16 Programming Contest Shizuoka. All Rights Reserved.</p>
                    <a href="/admin/index.html" class="admin-menu-link">AdminMenu</a>
                </div>
            </div>
        </footer>
    </div>

    <script src="/main.js"></script>
    <script src="qa.js"></script>
</body>

</html>

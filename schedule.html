<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開催情報 | U-16プログラミングコンテスト 静岡大会</title>
    <meta name="description" content="U-16プログラミングコンテスト静岡大会の今期の開催情報・過去の開催情報を掲載しています。">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700;900&display=swap"
        rel="stylesheet">
    <style>
        .schedule-tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .schedule-tab {
            background: white;
            border: 1.5px solid var(--primary-light);
            color: var(--text-dim);
            padding: 12px 28px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .schedule-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(26, 123, 196, 0.30);
        }

        .schedule-tab:not(.active):hover {
            background: var(--primary-pale);
            color: var(--primary);
        }

        .schedule-pane {
            display: none;
        }

        .schedule-pane.active {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
    </style>
</head>

<body>
    <header class="topnav" id="topnav">
        <div class="container topnav-inner">
            <a href="/index.html" class="topnav-brand">
                <img src="/logo.png" alt="U-16 ProCon Shizuoka Logo">
                <span>U-16 SHIZUOKA</span>
            </a>
            <nav class="topnav-nav" id="topnav-nav">
                <ul>
                    <li><a href="/index.html" class="tab-blue">HOME</a></li>
                    <li><a href="/about.html" class="tab-orange">大会について</a></li>
                    <li><a href="/schedule.html" class="tab-blue">開催情報</a></li>
                    <li><a href="/sponsor.html" class="tab-orange">スポンサー</a></li>
                    <li><a href="/qa/index.html" class="tab-blue">よくあるご質問</a></li>
                </ul>
                <div class="topnav-cta">
                    <a href="https://forms.gle/92aPXY5QAf1Min1u7" target="_blank" rel="noopener" class="btn-outline">お問い合わせ</a>
                </div>
            </nav>
            <button id="topnav-toggle" class="topnav-toggle" aria-label="メニューを開く">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>
    <div id="topnav-backdrop" class="topnav-backdrop"></div>

    <div class="page-body">
        <main>
            <div class="page-header container">
                <span class="subtitle">SCHEDULE</span>
                <h2>開催情報</h2>
                <div class="title-line" style="margin-left: auto; margin-right: auto;"></div>
            </div>

            <section class="section" style="padding-top: 0;">
                <div class="container">
                    <div class="schedule-tabs">
                        <button class="schedule-tab active" data-target="schedule-current">今期の開催情報</button>
                        <button class="schedule-tab" data-target="schedule-past">過去の開催情報</button>
                    </div>

                    <div id="schedule-current" class="schedule-pane active">
                        <div id="home-current-container" style="display: flex; flex-direction: column; gap: 20px;">
                            <p style="text-align: center; color: var(--text-dim); padding: 20px;" class="glass">開催情報を読み込んでいます...</p>
                        </div>
                    </div>

                    <div id="schedule-past" class="schedule-pane">
                        <div id="home-past-container" style="display: flex; flex-direction: column; gap: 20px;">
                            <p style="text-align: center; color: var(--text-dim); padding: 20px;" class="glass">過去の開催情報を読み込んでいます...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer style="margin-top: 0;">
            <div class="container">
                <div class="footer-content">
                    <div class="footer-info">
                        <div class="footer-section" id="footer-links-section" style="display: none;">
                            <h4>LINKS</h4>
                            <ul>
                                <li style="display: none;"><a href="#" target="_blank" rel="noopener" id="footer-terms-link">大会規約</a></li>
                                <li style="display: none;"><a href="#" target="_blank" rel="noopener" id="footer-privacy-link">プライバシーポリシー</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>&copy; 2026- U-16 Programming Contest Shizuoka. All Rights Reserved.</p>
                    <a href="/admin/index.html" class="admin-menu-link">AdminMenu</a>
                </div>
            </div>
        </footer>
    </div>

    <script src="/image-utils.js"></script>
    <script src="/main.js"></script>
</body>

</html>

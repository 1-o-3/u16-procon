<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スポンサー | U-16プログラミングコンテスト 静岡大会</title>
    <meta name="description" content="U-16プログラミングコンテスト静岡大会の主催・共催・協賛・後援企業・団体をご紹介します。">
    <link rel="icon" type="image/png" href="/logo.png">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@300;400;700;900&display=swap"
        rel="stylesheet">
    <style>
        .sponsor-group {
            margin-bottom: 50px;
        }

        .sponsor-group-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary-light);
        }

        .sponsor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .sponsor-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
            padding: 25px 20px;
        }

        .sponsor-card a,
        .sponsor-card span.sponsor-name {
            color: var(--text-main);
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
        }

        .sponsor-card a:hover {
            color: var(--primary);
        }

        /* ロゴ表示枠:「大」は正方形、「中」は幅が同じで高さが半分。長辺を枠に合わせて縮小表示する */
        .sponsor-logo-frame {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            background: white;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
        }

        .sponsor-logo-frame.size-medium {
            height: 90px;
        }

        .sponsor-logo-frame img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .sponsor-logo-frame.sponsor-logo-placeholder {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            background: var(--primary-pale);
        }
    </style>
</head>

<body>
    <header class="topnav" id="topnav">
        <div class="container topnav-inner">
            <a href="/index.html" class="topnav-brand">
                <img src="/logo.png" alt="U-16 ProCon Shizuoka Logo">
                <span>U-16 SHIZUOKA</span>
            </a>
            <nav class="topnav-nav" id="topnav-nav">
                <ul>
                    <li><a href="/index.html" class="tab-blue">HOME</a></li>
                    <li><a href="/about.html" class="tab-orange">大会について</a></li>
                    <li><a href="/schedule.html" class="tab-blue">開催情報</a></li>
                    <li><a href="/sponsor.html" class="tab-orange">スポンサー</a></li>
                    <li><a href="/qa/index.html" class="tab-blue">よくあるご質問</a></li>
                </ul>
                <div class="topnav-cta">
                    <a href="https://forms.gle/92aPXY5QAf1Min1u7" target="_blank" rel="noopener" class="btn-outline">お問い合わせ</a>
                </div>
            </nav>
            <button id="topnav-toggle" class="topnav-toggle" aria-label="メニューを開く">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>
    <div id="topnav-backdrop" class="topnav-backdrop"></div>

    <div class="page-body">
        <main>
            <div class="page-header container">
                <span class="subtitle">SPONSOR</span>
                <h2>スポンサー</h2>
                <div class="title-line" style="margin-left: auto; margin-right: auto;"></div>
            </div>

            <section class="section" style="padding-top: 0;">
                <div class="container">
                    <div id="sponsor-list-container">
                        <p style="text-align: center; color: var(--text-dim); padding: 20px;" class="glass">スポンサー情報を読み込んでいます...</p>
                    </div>
                </div>
            </section>
        </main>

        <footer style="margin-top: 0;">
            <div class="container">
                <div class="footer-content">
                    <div class="footer-info">
                        <div class="footer-section">
                            <h4>LINKS</h4>
                            <ul>
                                <li><a href="/docs/U-16 SHIZUOKA大会規約.pdf" target="_blank" id="footer-terms-link">大会規約</a></li>
                                <li><a href="/docs/U-16 SHIZUOKA プライバシーポリシー.pdf" target="_blank" id="footer-privacy-link">プライバシーポリシー</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>&copy; 2026- U-16 Programming Contest Shizuoka. All Rights Reserved.</p>
                    <a href="/admin/index.html" class="admin-menu-link">AdminMenu</a>
                </div>
            </div>
        </footer>
    </div>

    <script src="/main.js"></script>
</body>

</html>
